# Windows wheels of the packages that publish none yet for a new Python
# (pyodbc and PyYAML for 3.15, standard and free-threaded), compiled from their
# source on GitHub's Windows machines. scripts/package_wheels.py --extra puts
# them into the offline parts.
#
#   gh workflow run wheels-from-source.yml
#   gh run download --name wheels-cp315t --dir work/wheels-cp315t
name: wheels-from-source

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/wheels-from-source.yml"]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.15", "3.15t"]
    env:
      PY: ${{ matrix.python }}
      # The free-threaded Python runs with the GIL on, as pyodbc needs (as SDM's
      # scripts set it).
      PYTHON_GIL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY }}
          allow-prereleases: true
      - name: Build
        shell: pwsh
        run: |
          python -VV
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --no-deps --no-binary pyodbc,PyYAML -w wheels-built pyodbc==5.3.0 PyYAML==6.0.3
          python -m pip install --no-index --find-links wheels-built pyodbc PyYAML
          python -c "import pyodbc, yaml; print(pyodbc.version, yaml.__version__, yaml.__with_libyaml__, pyodbc.drivers())"
          $tag = python -c "import sys, sysconfig; print(f'cp{sys.version_info[0]}{sys.version_info[1]}' + ('t' if sysconfig.get_config_var('Py_GIL_DISABLED') else ''))"
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ env.TAG }}
          path: wheels-built/*.whl
      # SDM itself on this Python: what the offline parts install, every module
      # imported, and the generation tests that need no database (there is no
      # SQL Server here, and tests/conftest.py builds its state from one).
      - name: Test SDM
        shell: pwsh
        run: |
          python -m pip install --find-links wheels-built -r requirements-runtime.txt pytest==9.1.1 httpx==0.28.1 httpcore==1.0.9
          python -c "import importlib, pkgutil, sdg; bad = [m.name for m in pkgutil.walk_packages(sdg.__path__, 'sdg.') if not importlib.util.find_spec(m.name) or not importlib.import_module(m.name)]; print('modules imported'); assert not bad, bad"
          python -m pytest -q --noconftest -p no:cacheprovider tests/test_pattern_follows.py -k "slices or crosses or slice_by_slice"
